<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamBazaar | Official 4K OTT Store</title>
    
    <!-- SEO & OpenGraph Meta Tags -->
    <meta name="description" content="StreamBazaar - Premium OTT & Digital seats access store at lowest prices. Instant delivery, secure login, 1-device active support." />
    <meta property="og:title" content="StreamBazaar | Premium OTT Digital Store" />
    <meta property="og:description" content="Get premium 4K streaming accounts, PlayStation games, VPNs & AI tools at unbeatable prices with instant automated access." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StreamBazaar | Premium OTT Digital Store" />
    <meta name="twitter:description" content="Get premium 4K streaming accounts, PlayStation games, VPNs & AI tools at unbeatable prices with instant automated access." />
    <meta name="twitter:image" content="/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Disable Right Click (Context Menu)
      document.addEventListener('contextmenu', event => event.preventDefault());

      // Disable DevTools shortcuts (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+Shift+C)
      document.addEventListener('keydown', function(event) {
        // F12
        if (event.key === 'F12' || event.keyCode === 123) {
          event.preventDefault();
        }
        // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C
        if (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'i' || event.key === 'J' || event.key === 'j' || event.key === 'C' || event.key === 'c')) {
          event.preventDefault();
        }
        // Ctrl+U (View Source)
        if (event.ctrlKey && (event.key === 'U' || event.key === 'u')) {
          event.preventDefault();
        }
      });
    </script>
  </body>
</html>
